<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Online - Sorveteria Itapolitana</title>
    <link rel="stylesheet" href="css/design-system.min.css">
    <style>
        .orders-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .order-form {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1A0A00;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #EF0129;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #EF0129, #C62828);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="orders-container">
        <h1>🛒 Faça seu Pedido Online</h1>
        <form class="order-form" id="order-form">
            <div class="form-group">
                <label for="name">Nome *</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Telefone/WhatsApp *</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="product">Produto *</label>
                <select id="product" name="product" required>
                    <option value="">Selecione um produto</option>
                    <option value="sorvete">Sorvete</option>
                    <option value="picole">Picolé</option>
                    <option value="acai">Açaí</option>
                    <option value="milkshake">Milkshake</option>
                    <option value="taca">Taça</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">Quantidade *</label>
                <input type="number" id="quantity" name="quantity" min="1" required>
            </div>
            <div class="form-group">
                <label for="notes">Observações</label>
                <textarea id="notes" name="notes" rows="4"></textarea>
            </div>
            <button type="submit">Enviar Pedido</button>
        </form>
    </div>
    <script>
        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const product = document.getElementById('product').value;
            const quantity = document.getElementById('quantity').value;
            const notes = document.getElementById('notes').value;
            
            const message = `Olá! Gostaria de fazer um pedido: ${quantity}x ${product}. Observações: ${notes || 'Nenhuma'}`;
            const whatsappUrl = `https://wa.me/55${phone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
