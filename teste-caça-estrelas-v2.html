<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE v2.0 - Itamanduá: A Corrida das Estrelas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
        .painel-teste { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto 20px; border-top: 5px solid #fbc02d; }
        .status-motor { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding: 10px; background: #fff9c4; border-radius: 8px; font-weight: bold; }
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-ativar { background: #fbc02d; color: #333; }
        .btn-ativar:hover { background: #f9a825; }
        .btn-reset { background: #e0e0e0; color: #666; }
        .ranking { background: white; padding: 20px; border-radius: 15px; max-width: 600px; margin: 0 auto; }
        .ranking h3 { margin-top: 0; color: #1976d2; border-bottom: 2px solid #e3f2fd; padding-bottom: 10px; }
        .item-ranking { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .estrela-viva { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; cursor: pointer; z-index: 9999; animation: pulsar 1.5s infinite; filter: drop-shadow(0 0 20px gold); }
        @keyframes pulsar { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .fala-mascote { background: white; border: 2px solid #fbc02d; padding: 10px; border-radius: 15px; position: fixed; bottom: 120px; right: 20px; max-width: 200px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
        .fala-mascote::after { content: ''; position: absolute; bottom: -10px; right: 20px; border-width: 10px 10px 0; border-style: solid; border-color: #fbc02d transparent; }
        .escolha-premio { display: none; background: white; padding: 20px; border-radius: 15px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000; box-shadow: 0 0 50px rgba(0,0,0,0.5); text-align: center; }
        .opcoes-premio { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-premio { background: #4caf50; color: white; padding: 15px; }
    </style>
</head>
<body>

    <div class="painel-teste">
        <h2>🛠️ PAINEL DE TESTE v2.0</h2>
        <div class="status-motor" id="status-motor">
            🔴 Motor Desconectado
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Seu Nome:</label><br>
            <input type="text" id="nome-teste" value="Caçador de Teste" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Seu Celular:</label><br>
            <input type="text" id="celular-teste" value="(16) 99999-9999" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc;">
        </div>

        <div class="controles">
            <button class="btn-ativar" onclick="ativarEstrelaAgora()">🌟 Ativar Estrela AGORA</button>
            <button class="btn-reset" onclick="resetarTeste()">🔄 Resetar Tudo</button>
        </div>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">
            * A estrela permanecerá na tela até você clicar nela (Regra de Permanência).
        </p>
    </div>

    <div class="ranking">
        <h3>🏆 Ranking de Teste (Mês Atual)</h3>
        <div id="lista-ranking">
            <p style="color: #999;">Nenhuma captura registrada ainda...</p>
        </div>
    </div>

    <!-- Elementos do Jogo -->
    <div id="estrela-container"></div>
    <div id="fala-mascote" class="fala-mascote"></div>

    <!-- Modal de Escolha de Prêmio -->
    <div id="modal-premio" class="escolha-premio">
        <h3>🌟 PARABÉNS! 🌟</h3>
        <p>Você completou a meta de 5 estrelas!<br>Escolha seu prêmio agora:</p>
        <div class="opcoes-premio">
            <button class="btn-premio" onclick="escolherPremio('acai')">🍧 Açaí Promocional (400ml)</button>
            <button class="btn-premio" onclick="escolherPremio('milkshake')">🥤 Milkshake Delicioso</button>
            <button class="btn-premio" onclick="escolherPremio('picoles')">🍦 5 Picolés Recheados</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/motor-estrelas-v2.js"></script>
    <script>
        const motor = new MotorEstrelasV2();
        let estrelaAtiva = false;

        // Inicializar
        window.onload = async () => {
            const ok = await motor.inicializar();
            if (ok) {
                atualizarStatus();
                atualizarRanking();
            }
        };

        function atualizarStatus() {
            const status = motor.obterStatus();
            const el = document.getElementById('status-motor');
            el.innerHTML = `🟢 Motor Ativo (${status.usuariosOnline} caçadores online)`;
            el.style.background = '#c8e6c9';
            
            // Simular falas do mascote
            const falas = [
                `🕵️‍♂️ Shhh! Tem ${status.usuariosOnline} caçadores de olho em mim agora...`,
                `👀 Cuidado! Vi ${status.usuariosOnline} pessoas procurando a estrela!`,
                `🌟 A disputa está quente! Quem será o primeiro a clicar?`
            ];
            const falaEl = document.getElementById('fala-mascote');
            falaEl.style.display = 'block';
            falaEl.innerHTML = falas[Math.floor(Math.random() * falas.length)];
        }

        function atualizarRanking() {
            const status = motor.obterStatus();
            const lista = document.getElementById('lista-ranking');
            if (status.rankingTop5.length === 0) {
                lista.innerHTML = '<p style="color: #999;">Nenhuma captura registrada ainda...</p>';
                return;
            }
            
            lista.innerHTML = status.rankingTop5.map((u, i) => `
                <div class="item-ranking">
                    <span>${i+1}º ${u.nome}</span>
                    <span style="font-weight: bold; color: #fbc02d;">${'🌟'.repeat(u.estrelas)} (${u.estrelas})</span>
                </div>
            `).join('');
        }

        function ativarEstrelaAgora() {
            if (estrelaAtiva) return;
            estrelaAtiva = true;
            
            const container = document.getElementById('estrela-container');
            container.innerHTML = '<div class="estrela-viva" onclick="clicarNaEstrela()">🌟</div>';
            
            const falaEl = document.getElementById('fala-mascote');
            falaEl.innerHTML = "🌟 UAU! A ESTRELA ESCAPOU! PEGA RÁPIDO ANTES DOS OUTROS!";
            falaEl.style.borderColor = "gold";
            falaEl.style.background = "#fff9c4";
        }

        async function clicarNaEstrela() {
            const nome = document.getElementById('nome-teste').value;
            const celular = document.getElementById('celular-teste').value;
            
            const resultado = await motor.processarClique();
            
            if (resultado.sucesso) {
                // Efeito visual
                const estrela = document.querySelector('.estrela-viva');
                estrela.style.transition = '2s';
                estrela.style.transform = 'translate(-50%, -50%) scale(5) rotate(360deg)';
                estrela.style.opacity = '0';
                
                setTimeout(async () => {
                    document.getElementById('estrela-container').innerHTML = '';
                    estrelaAtiva = false;
                    
                    // Verificar se atingiu a meta (simulando 5 estrelas para teste)
                    const usuarioId = celular.replace(/\D/g, '');
                    const dadosUsuario = motor.rankingAtual[usuarioId] || { estrelas: 0 };
                    
                    if (dadosUsuario.estrelas + 1 >= 5) {
                        document.getElementById('modal-premio').style.display = 'block';
                    } else {
                        // Registro normal
                        await motor.registrarCaptura(usuarioId, nome, celular, 'acai'); // Default para teste
                        alert(`🏆 PARABÉNS ${nome}! Você capturou a estrela!\nAgora você tem ${motor.rankingAtual[usuarioId].estrelas} estrelas.`);
                        atualizarRanking();
                    }
                }, 500);
            }
        }

        async function escolherPremio(tipo) {
            const nome = document.getElementById('nome-teste').value;
            const celular = document.getElementById('celular-teste').value;
            const usuarioId = celular.replace(/\D/g, '');
            
            await motor.registrarCaptura(usuarioId, nome, celular, tipo);
            document.getElementById('modal-premio').style.display = 'none';
            
            alert(`🏆 CAMPEÃO DO MÊS!\nVocê escolheu: ${motor.PREMIO_OPCOES[tipo].nome}\nSeu prêmio foi salvo no Admin!`);
            atualizarRanking();
        }

        function resetarTeste() {
            localStorage.removeItem('estrela_ciclo_backup');
            location.reload();
        }

        // Atualizar status periodicamente
        setInterval(atualizarStatus, 5000);
    </script>
</body>
</html>
