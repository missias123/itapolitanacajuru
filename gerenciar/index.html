<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Itapolitana Cajuru</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/smartcrop/2.1.0/smartcrop.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f5f8;color:#111827;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:#fff;border-radius:16px;padding:32px 24px;max-width:360px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center}
.login-box h2{font-size:20px;font-weight:900;margin-bottom:8px}
.login-box p{font-size:13px;color:#6A0DAD;font-weight:700;margin-bottom:24px}
.login-box input{width:100%;padding:12px 44px 12px 14px;border:1px solid #E5E7EB;border-radius:10px;font-size:15px;outline:none}
.senha-wrap{position:relative;margin-bottom:12px;}
.senha-wrap input{width:100%;}
.olho-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#6A0DAD;padding:0;line-height:1;user-select:none;}
.login-box input:focus{border-color:#6A0DAD}
.btn-login{width:100%;padding:13px;background:#6A0DAD;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
.btn-login:hover{background:#5a0b9d}
.back-link{display:block;margin-top:16px;font-size:13px;color:#6A0DAD;text-decoration:none}
#admin-panel{display:none}
.admin-header{background:#1F2937;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.admin-header h1{font-size:16px;font-weight:800}
.btn-logout{background:#EF4444;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
.admin-body{max-width:960px;margin:0 auto;padding:20px 16px 100px}
.cat-section{background:#fff;border-radius:14px;border:1px solid #E5E7EB;margin-bottom:16px;overflow:hidden}
.cat-header{padding:14px 18px;background:#F9FAFB;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.cat-header h3{font-size:15px;font-weight:800;flex:1}
.cat-arrow{font-size:12px;color:#6A0DAD;transition:transform .3s}
.cat-section.open .cat-arrow{transform:rotate(180deg)}
.cat-body{display:none;padding:16px}
.cat-section.open .cat-body{display:block}
.save-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E5E7EB;padding:12px 20px;display:flex;gap:10px;justify-content:center;z-index:200}
.btn-save{background:#6A0DAD;color:#fff;border:none;border-radius:10px;padding:12px 32px;font-size:15px;font-weight:800;cursor:pointer}
.btn-save:hover{background:#5a0b9d}
.status-msg{font-size:13px;font-weight:700;color:#10B981;align-self:center}




body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('../images/fundo-itapolitana.png');
    background-repeat: repeat;
    background-size: 150px 150px;
    opacity: 0.15; /* Aumentado para maior visibilidade */
    pointer-events: none;
    z-index: -1;
}
body {
    position: relative;
    z-index: 0;
    background-color: #FFF8F0;
}

</style>
</head>
<body>
<div class="login-wrap" id="login-section">
  <div class="login-box">
    <h2>⚙️ Painel Admin</h2>
    <p>Sorveteria Itapolitana Cajuru</p>
    <div class="senha-wrap">
      <input type="password" id="admin-password" placeholder="Senha administrativa" onkeypress="if(event.key==='Enter')checkLogin()">
      <button type="button" class="olho-btn" onclick="toggleSenha()" title="Mostrar/ocultar senha" aria-label="Mostrar ou ocultar senha">&#128065;</button>
    </div>
    <button type="button" class="btn-login" onclick="checkLogin()">Entrar</button>
    <a href="../index.html" class="back-link">← Voltar ao site</a>
  </div>
</div>

<div id="admin-panel">
  <div class="admin-header">
    <h1>⚙️ Gerenciamento – Itapolitana Cajuru</h1>
    <button type="button" class="btn-logout" onclick="logout()">Sair</button>
  </div>
  
  <div class="admin-body">
    
    <div class="cat-section open">
      <div class="cat-header">
        <h3>📢 Promoção e Sorteio</h3>
      </div>
      <div class="cat-body">
        <div style="background:#F9FAFB; border:1px solid #E5E7EB; border-radius:12px; padding:20px;">
          <div style="margin-bottom:15px;">
            <label style="font-size:12px; font-weight:700; color:#374151; display:block; margin-bottom:5px;">Título da Promoção</label>
            <input id="promo-titulo" type="text" style="width:100%; padding:10px; border:1px solid #D1D5DB; border-radius:8px;">
          </div>
          
          <div style="margin-bottom:15px;">
            <label style="font-size:12px; font-weight:700; color:#374151; display:block; margin-bottom:5px;">Mês do Sorteio</label>
            <input id="promo-mes" type="text" placeholder="Ex: Março 2026" style="width:100%; padding:10px; border:1px solid #D1D5DB; border-radius:8px;">
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
            <div>
              <label style="font-size:12px; font-weight:700; color:#374151; display:block; margin-bottom:5px;">Data do Sorteio</label>
              <input id="promo-data-fim" type="date" style="width:100%; padding:10px; border:1px solid #D1D5DB; border-radius:8px;">
            </div>
            <div>
              <label style="font-size:12px; font-weight:700; color:#374151; display:block; margin-bottom:5px;">Hora (00:01)</label>
              <input id="promo-hora-fim" type="time" value="00:01" style="width:100%; padding:10px; border:1px solid #D1D5DB; border-radius:8px;">
            </div>
          </div>

          <div style="margin-bottom:20px;">
            <label style="font-size:12px; font-weight:700; color:#374151; display:block; margin-bottom:5px;">Link da Publicação (Instagram)</label>
            <input id="promo-link-instagram" type="url" placeholder="https://instagram.com/p/..." style="width:100%; padding:10px; border:1px solid #D1D5DB; border-radius:8px;">
          </div>

          <button type="button" onclick="salvarPromo()" style="width:100%; background:#6A0DAD; color:#fff; border:none; border-radius:10px; padding:15px; font-weight:800; cursor:pointer;">
            💾 Salvar e Publicar Promoção
          </button>
          <div id="promo-status" style="margin-top:10px; text-align:center; font-size:13px; font-weight:700; color:#10B981;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const PROMO_KEY = 'itapolitana_promo_data';

function checkLogin() {
  const pass = document.getElementById('admin-password').value;
  if (pass === 'itapolitana2007@') {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    carregarDados();
  } else {
    alert('Senha incorreta!');
  }
}

function toggleSenha() {
  const inp = document.getElementById('admin-password');
  const btn = inp.parentElement.querySelector('.olho-btn');
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.innerHTML = '&#128064;';
  } else {
    inp.type = 'password';
    btn.innerHTML = '&#128065;';
  }
}

function logout() {
  location.reload();
}

function carregarDados() {
  const saved = localStorage.getItem(PROMO_KEY);
  if (saved) {
    const data = JSON.parse(saved);
    document.getElementById('promo-titulo').value = data.titulo || '';
    document.getElementById('promo-mes').value = data.mes || '';
    document.getElementById('promo-data-fim').value = data.dataFim || '';
    document.getElementById('promo-hora-fim').value = data.horaFim || '00:01';
    document.getElementById('promo-link-instagram').value = data.link || '';
  }
}

function salvarPromo() {
  const data = {
    titulo: document.getElementById('promo-titulo').value,
    mes: document.getElementById('promo-mes').value,
    dataFim: document.getElementById('promo-data-fim').value,
    horaFim: document.getElementById('promo-hora-fim').value,
    link: document.getElementById('promo-link-instagram').value,
    updatedAt: new Date().toISOString()
  };
  
  localStorage.setItem(PROMO_KEY, JSON.stringify(data));
  document.getElementById('promo-status').textContent = "✅ Promoção atualizada com sucesso!";
  setTimeout(() => document.getElementById('promo-status').textContent = "", 3000);
}
</script>
</body>
</html>
