async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkLogin() {
  const pass = document.getElementById('admin-password').value;
  const hash = await sha256(pass);
  if (hash === HASH_SENHA) {
    sessionStorage.setItem(LOGIN_KEY, 'true');
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    carregarDados();
  } else {
    alert('Senha incorreta!');
  }
}

function logout() {
  sessionStorage.removeItem(LOGIN_KEY);
  location.reload();
}

function toggleSenha() {
  const campo = document.getElementById('admin-password');

    botao.textContent = '🙈';

    campo.type = 'password';
    botao.textContent = '👁️';
  }
}

async function carregarDados() {
  try {
    const response = await fetch(`../_data/cardapio.json?v=${new Date().getTime()}`);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    dados = await response.json();
    promoStorage = JSON.parse(localStorage.getItem(PROMO_KEY) || "{}");
    console.log("Dados carregados:", dados);
    console.log("Promoções carregadas:", promoStorage);
    renderizarPainel();
  } catch (e) {
    console.error("Erro ao carregar dados:", e);
    document.getElementById('admin-body').innerHTML = `<p style="color:red;text-align:center;">Falha ao carregar dados. Verifique o console.</p>`;
  }
}

function salvarPromoLocal() {
  promoStorage.titulo = document.getElementById('promo-titulo').value;
  promoStorage.subtitulo = document.getElementById('promo-subtitulo').value;
  promoStorage.dataFim = document.getElementById('promo-data-fim').value;
  promoStorage.horaFim = document.getElementById('promo-hora-fim').value;
  
  // Salva os novos campos do sorteio
  if(document.getElementById('promo-mes')) {
    promoStorage.mesSorteio = document.getElementById('promo-mes').value;
    promoStorage.linkInstagram = document.getElementById('promo-link-instagram').value;
    promoStorage.plataformaSorteio = document.querySelector('input[name="plataforma-sorteio"]:checked').value;
  }

  localStorage.setItem(PROMO_KEY, JSON.stringify(promoStorage));
  console.log("Promoção salva localmente:", promoStorage);
  document.getElementById('promo-status').textContent = "Alterações locais salvas!";
  setTimeout(() => document.getElementById('promo-status').textContent = "", 3000);
}

function postarPromocao() {
  salvarPromoLocal(); // Garante que os dados mais recentes estão no objeto
  // A lógica para enviar para um servidor/backend viria aqui
  console.log("Postando promoção:", promoStorage);
  alert("Promoção postada com sucesso! (Simulação)");
  document.getElementById('promo-status').textContent = "Promoção publicada no site!";
}

function desativarPromocao() {
  localStorage.removeItem(PROMO_KEY);
  promoStorage = {};
  document.getElementById('promo-titulo').value = '';
  document.getElementById('promo-subtitulo').value = '';
  document.getElementById('promo-data-fim').value = '';
  document.getElementById('promo-hora-fim').value = '22:00';
  if(document.getElementById('promo-mes')) {
    document.getElementById('promo-mes').value = '';
    document.getElementById('promo-link-instagram').value = '';
  }
  alert("Promoção desativada.");
  document.getElementById('promo-status').textContent = "Promoção removida do site.";
}


function renderizarCategoria(catId, categoria) {
  if (catId === 'acai') {
    return renderizarAcai(categoria.produtos, categoria.opcoes);
  } else if (catId === 'precosSimples') {
    return renderizarPrecosSimples(categoria.itens);
  } else {
    return renderizarProdutosPadrao(catId, categoria.produtos);
  }
}

function renderizarProdutosPadrao(catId, produtos) {
  let html = '<div class="prod-edit-grid">';
  for (const prodId in produtos) {
    const produto = produtos[prodId];
    html += `
      <div class="prod-edit-card" id="prod-${catId}-${prodId}">
        <h4>${produto.nome}</h4>
        <div class="field-row">
          <div style="flex:1">
            <label for="preco-${catId}-${prodId}">Preço (R$)</label>
            <input type="text" id="preco-${catId}-${prodId}" value="${produto.preco}" oninput="marcarAlteracao('categorias.${catId}.produtos.${prodId}.preco', this.value)">
          </div>
          <div style="flex:1">
            <label for="estoque-${catId}-${prodId}">Estoque</label>
            <input type="text" id="estoque-${catId}-${prodId}" value="${produto.estoque}" oninput="marcarAlteracao('categorias.${catId}.produtos.${prodId}.estoque', this.value)">
          </div>
        </div>
      </div>
    `;
  }
  html += '</div>';
  return html;
}

function renderizarAcai(produtos, opcoes) {
  let html = '<h4>Preços do Açaí</h4><div class="preco-simples-grid">';
  for (const prodId in produtos) {
    const produto = produtos[prodId];
    html += `
      <div class="preco-simples-card">
        <label for="preco-acai-${prodId}">${produto.nome}</label>
        <input type="text" id="preco-acai-${prodId}" value="${produto.preco}" oninput="marcarAlteracao('categorias.acai.produtos.${prodId}.preco', this.value)">
      </div>
    `;
  }
  html += '</div><h4 style="margin-top:16px">Opções de Açaí Esgotadas</h4><div class="sabores-grid">';
  opcoes.forEach((opcao, index) => {
    html += `<div class="sabor-chip ${opcao.esgotado ? 'esgotado' : ''}" onclick="toggleEsgotado(this, 'categorias.acai.opcoes[${index}].esgotado')">${opcao.nome}</div>`;
  });
  html += '</div>';
  return html;
}

function renderizarPrecosSimples(itens) {
  let html = '<div class="preco-simples-grid">';
  for (const itemId in itens) {
    const item = itens[itemId];
    html += `
      <div class="preco-simples-card">
        <label for="preco-simples-${itemId}">${item.nome}</label>
        <input type="text" id="preco-simples-${itemId}" value="${item.preco}" oninput="marcarAlteracao('categorias.precosSimples.itens.${itemId}.preco', this.value)">
      </div>
    `;
  }
  html += '</div>';
  return html;
}

function toggleEsgotado(element, path) {
  const isEsgotado = element.classList.toggle('esgotado');
  marcarAlteracao(path, isEsgotado);
}

function marcarAlteracao(path, value) {
  // Usando notação de ponto para aninhar
  const keys = path.split('.');
  let current = alteracoes;
  for (let i = 0; i < keys.length - 1; i++) {
    const key = keys[i];
    // Se a chave for um array, como 'opcoes[0]', precisamos tratar
    const arrayMatch = key.match(/(\w+)\[(\d+)\]/);
    if (arrayMatch) {
      const arrayName = arrayMatch[1];
      const index = parseInt(arrayMatch[2], 10);
      if (!current[arrayName]) current[arrayName] = [];
      if (!current[arrayName][index]) current[arrayName][index] = {};
      current = current[arrayName][index];
    } else {
      if (!current[key]) current[key] = {};
      current = current[key];
    }
  }
  current[keys[keys.length - 1]] = value;
  
  document.getElementById('save-bar').style.display = 'flex';
  document.getElementById('status-msg').textContent = 'Alterações pendentes...';
  console.log("Alterações:", alteracoes);
}

}

// Funções de diagnóstico
function toggleDiagnostico() {
  const painel = document.getElementById('painel-diagnostico');
  if (painel.classList.contains('aberto')) {
    painel.classList.remove('aberto');
  } else {
    painel.classList.add('aberto');
    executarDiagnostico();
  }
}

function executarDiagnostico() {
  const painel = document.getElementById('painel-diagnostico');
  painel.innerHTML = '<div class="diag-titulo">🔍 Verificando sistema...</div>';
  
  let erros = [];
  
  // 1. Versão do Admin
  painel.innerHTML += `<div class="diag-item diag-info">Versão do Painel: <strong>${VersaoAdmin}</strong></div>`;

  // 2. Conexão (simulado)
  if (navigator.onLine) {
    painel.innerHTML += `<div class="diag-item diag-ok">✅ Conexão com a internet está OK.</div>`;
  } else {
    painel.innerHTML += `<div class="diag-item diag-erro">❌ Sem conexão com a internet.</div>`;
    erros.push("Sem internet");
  }

  // 3. Acesso ao JSON
  if (dados && Object.keys(dados).length > 0) {
    painel.innerHTML += `<div class="diag-item diag-ok">✅ Arquivo <code>cardapio.json</code> carregado.</div>`;
  } else {
    painel.innerHTML += `<div class="diag-item diag-erro">❌ Falha ao carregar <code>cardapio.json</code>.</div>`;
    erros.push("JSON não carregado");
  }

  // 4. Validade da Promoção
  if (promoStorage.dataFim) {
    const dataFim = new Date(`${promoStorage.dataFim}T${promoStorage.horaFim || '23:59:59'}`);
    if (dataFim < new Date()) {
      painel.innerHTML += `<div class="diag-item diag-aviso">⚠️ A data da promoção já expirou (${dataFim.toLocaleDateString()}).</div>`;
    } else {
      painel.innerHTML += `<div class="diag-item diag-ok">✅ Promoção ativa e dentro da validade.</div>`;
    }
  } else {
     painel.innerHTML += `<div class="diag-item diag-info">ℹ️ Nenhuma promoção com data de término configurada.</div>`;
  }

  // Resumo
  if (erros.length > 0) {
    painel.innerHTML += `<div class="diag-item diag-erro" style="margin-top:12px"><strong>${erros.length} problema(s) encontrado(s).</strong></div>`;
  } else {
    painel.innerHTML += `<div class="diag-item diag-ok" style="margin-top:12px"><strong>Nenhum problema crítico encontrado.</strong></div>`;
  }
}
