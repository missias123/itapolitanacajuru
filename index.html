  <script>
    (function(){
      'use strict';
      if (!window.ITAP_CONSENT) return;
      var banner = document.getElementById('cookie-banner');

        banner.style.display = 'block';
        setTimeout(function(){ document.getElementById('btn-cookie-aceitar')?.focus(); }, 50);

      function close(){ banner.style.display = 'none'; }
      document.getElementById('btn-cookie-aceitar')?.addEventListener('click', function(){ window.ITAP_CONSENT.set({ analytics:true, ts:Date.now() }); close(); });
