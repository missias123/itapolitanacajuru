<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria - Sorveteria Itapolitana</title>
    <link rel="stylesheet" href="css/design-system.min.css">
    <style>
        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            aspect-ratio: 1;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
        .gallery-overlay p {
            color: white;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <h1>📸 Galeria de Fotos</h1>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images/sorvetes-montanha.webp" alt="Sorvetes empilhados">
                <div class="gallery-overlay"><p>Sorvetes Artesanais</p></div>
            </div>
            <div class="gallery-item">
                <img src="images/logo.webp" alt="Logo Itapolitana">
                <div class="gallery-overlay"><p>Nossa Marca</p></div>
            </div>
            <div class="gallery-item">
                <img src="images/itamandua_1bola.webp" alt="Itamanduá">
                <div class="gallery-overlay"><p>Mascote Itamanduá</p></div>
            </div>
        </div>
    </div>
</body>
</html>
