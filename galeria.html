    <link rel="stylesheet" href="css/design-system.min.css">
    <style>
        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            font-family: 'Nunito', sans-serif;
        }
        .gallery-container h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #C62828;
            margin-bottom: 8px;
        }
        .gallery-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #1565C0;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            aspect-ratio: 1;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
        .gallery-overlay p {
            color: white;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <a class="gallery-back" href="index.html">← Voltar para o início</a>
        <h1>📸 Galeria – Sorveteria Itapolitana Cajuru</h1>
        <p style="color:#666;margin-bottom:20px;font-size:0.9rem;">Sorvete tipo artesanal, açaí, picolés e muito mais desde 2007 em Cajuru/SP.</p>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images/sorvetes-montanha.webp" alt="Sorvetes tipo artesanal empilhados – Sorveteria Itapolitana Cajuru" loading="lazy" decoding="async">
                <div class="gallery-overlay"><p>Sorvetes Tipo Artesanais</p></div>
            </div>
            <div class="gallery-item">
                <img src="images/logo.webp" alt="Logo da Sorveteria Itapolitana Cajuru – Desde 2007" loading="lazy" decoding="async">
                <div class="gallery-overlay"><p>Nossa Marca</p></div>
            </div>
            <div class="gallery-item">
                <img src="images/mascote_itapolitana.webp" alt="Mascote Itamanduá – Sorveteria Itapolitana Cajuru" loading="lazy" decoding="async" onerror="this.closest('.gallery-item').style.display='none'">
                <div class="gallery-overlay"><p>Mascote Itamanduá</p></div>
    </div>
</div>
