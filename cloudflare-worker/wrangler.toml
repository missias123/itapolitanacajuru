name = "itapolitanacajuru"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── KV Namespaces ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding    = "CLIENTES_KV"
id         = "b75fa5373ee0486ca8642bdedcd69a15"
preview_id = "b75fa5373ee0486ca8642bdedcd69a15"

[[kv_namespaces]]
binding    = "ENCOMENDAS_KV"
id         = "733a7c99a6fb406196a68aebb2c8fb88"
preview_id = "733a7c99a6fb406196a68aebb2c8fb88"

[[kv_namespaces]]
binding    = "RATE_KV"
id         = "7b024fbb09224336b65bfc5aa0080a56"
preview_id = "7b024fbb09224336b65bfc5aa0080a56"

# ─── KV namespace para a promoção do Picolé (30 dias) ─────────────────────────
# Namespace criado na conta Cloudflare de produção: PROMO_KV (id abaixo).
# O mesmo namespace é usado no ambiente de preview para impedir divergência de configuração.
[[kv_namespaces]]
binding    = "PROMO_KV"
id         = "883b9fd1e89d445e8257f930cb26a3c1"
preview_id = "883b9fd1e89d445e8257f930cb26a3c1"

# ─── Durable Object para reserva atômica do Picolé ────────────────────────────
# A classe é registrada pela migration abaixo no primeiro deploy.
# Validar limites/plano da conta no Cloudflare antes de ativar a campanha real.
[durable_objects]
bindings = [
  { name = "PICOLE_RESERVA_DO", class_name = "PicoleReservaDO" }
]

# Migration obrigatória — registra a classe PicoleReservaDO no primeiro deploy
[[migrations]]
tag         = "v1"
new_classes = ["PicoleReservaDO"]

# ─── Variáveis de ambiente públicas ───────────────────────────────────────────
[vars]
ENVIRONMENT = "production"

[env.production]
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.kv_namespaces]]
binding    = "CLIENTES_KV"
id         = "b75fa5373ee0486ca8642bdedcd69a15"
preview_id = "b75fa5373ee0486ca8642bdedcd69a15"
[[env.production.kv_namespaces]]
binding    = "ENCOMENDAS_KV"
id         = "733a7c99a6fb406196a68aebb2c8fb88"
preview_id = "733a7c99a6fb406196a68aebb2c8fb88"
[[env.production.kv_namespaces]]
binding    = "RATE_KV"
id         = "7b024fbb09224336b65bfc5aa0080a56"
preview_id = "7b024fbb09224336b65bfc5aa0080a56"
[[env.production.kv_namespaces]]
binding    = "PROMO_KV"
id         = "883b9fd1e89d445e8257f930cb26a3c1"
preview_id = "883b9fd1e89d445e8257f930cb26a3c1"

[env.production.durable_objects]
bindings = [
  { name = "PICOLE_RESERVA_DO", class_name = "PicoleReservaDO" }
]

# ─── Rota personalizada — domínio de produção ─────────────────────────────────
# O nome do Worker deve permanecer alinhado ao serviço já roteado pela API pública.
# NOTA: Requer que a zona itapolitanacajuru.com.br esteja gerenciada pelo Cloudflare
# e que exista um registro DNS para api.itapolitanacajuru.com.br (ex: A 192.0.2.1, proxied).
[[env.production.routes]]
pattern   = "api.itapolitanacajuru.com.br/*"
zone_name = "itapolitanacajuru.com.br"
