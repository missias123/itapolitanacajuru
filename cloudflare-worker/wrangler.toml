name = "itapolitana-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── KV Namespaces ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding    = "CLIENTES_KV"
id         = "b75fa5373ee0486ca8642bdedcd69a15"
preview_id = "b75fa5373ee0486ca8642bdedcd69a15"

[[kv_namespaces]]
binding    = "ENCOMENDAS_KV"
id         = "733a7c99a6fb406196a68aebb2c8fb88"
preview_id = "733a7c99a6fb406196a68aebb2c8fb88"

[[kv_namespaces]]
binding    = "RATE_KV"
id         = "7b024fbb09224336b65bfc5aa0080a56"
preview_id = "7b024fbb09224336b65bfc5aa0080a56"

# ─── KV namespace para a promoção do Picolé (30 dias) ─────────────────────────
# INSTRUÇÕES: antes de fazer deploy, crie o namespace no dashboard do Cloudflare:
#   1. Acesse Workers & Pages → KV → Create namespace → nome: "PROMO_KV"
#   2. Copie o ID gerado e substitua os dois valores abaixo.
#   3. Faça o mesmo para o ambiente de produção (env.production) mais abaixo.
[[kv_namespaces]]
binding    = "PROMO_KV"
id         = "SUBSTITUA_PELO_ID_DO_PROMO_KV"
preview_id = "SUBSTITUA_PELO_ID_DO_PROMO_KV"

# ─── Durable Object para reserva atômica do Picolé ────────────────────────────
# REQUISITO: Cloudflare Workers Paid Plan (mínimo US$5/mês — Workers Paid).
# INSTRUÇÕES: o Cloudflare cria a classe automaticamente via a migration abaixo
# na primeira implantação. Nenhuma ação manual adicional é necessária além
# de ter o plano pago ativo na conta.
[durable_objects]
bindings = [
  { name = "PICOLE_RESERVA_DO", class_name = "PicoleReservaDO" }
]

# Migration obrigatória — registra a classe PicoleReservaDO no primeiro deploy
[[migrations]]
tag         = "v1"
new_classes = ["PicoleReservaDO"]

# ─── Variáveis de ambiente públicas ───────────────────────────────────────────
[vars]
ENVIRONMENT = "production"

[env.production]
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.kv_namespaces]]
binding    = "CLIENTES_KV"
id         = "b75fa5373ee0486ca8642bdedcd69a15"
preview_id = "b75fa5373ee0486ca8642bdedcd69a15"
[[env.production.kv_namespaces]]
binding    = "ENCOMENDAS_KV"
id         = "733a7c99a6fb406196a68aebb2c8fb88"
preview_id = "733a7c99a6fb406196a68aebb2c8fb88"
[[env.production.kv_namespaces]]
binding    = "RATE_KV"
id         = "7b024fbb09224336b65bfc5aa0080a56"
preview_id = "7b024fbb09224336b65bfc5aa0080a56"
[[env.production.kv_namespaces]]
binding    = "PROMO_KV"
id         = "SUBSTITUA_PELO_ID_DO_PROMO_KV"
preview_id = "SUBSTITUA_PELO_ID_DO_PROMO_KV"

[env.production.durable_objects]
bindings = [
  { name = "PICOLE_RESERVA_DO", class_name = "PicoleReservaDO" }
]

# ─── Rota personalizada — domínio de produção ─────────────────────────────────
# NOTA: Requer que a zona itapolitanacajuru.com.br esteja gerenciada pelo Cloudflare
# e que exista um registro DNS para api.itapolitanacajuru.com.br (ex: A 192.0.2.1, proxied).
[[env.production.routes]]
pattern   = "api.itapolitanacajuru.com.br/*"
zone_name = "itapolitanacajuru.com.br"
