<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Encomendas | Sorveteria Itapolitana Cajuru</title>
  <link rel="stylesheet" href="css/itap-shared.css">
  <link rel="stylesheet" href="css/itap-refinements.css">
  <style>
    :root {
      --azul: #1565C0;
      --azul-escuro: #0D47A1;
      --vermelho: #D32F2F;
      --verde: #2E7D32;
      --amarelo: #F9A825;
      --cinza: #9E9E9E;
    }
    body { font-family: 'Nunito', sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    .header { background: var(--azul-escuro); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
    
    /* Accordion Style */
    .categoria { background: white; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
    .categoria-header { 
        padding: 20px; background: var(--azul); color: white; cursor: pointer; 
        display: flex; justify-content: space-between; align-items: center;
        border: none; width: 100%; text-align: left;
    }
    .categoria-conteudo { display: none; padding: 20px; border-top: 1px solid #eee; }
    
    /* Product Cards */
    .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .prod-card { border: 1px solid #eee; border-radius: 10px; padding: 15px; text-align: center; background: #fff; }
    .prod-nome { font-weight: 800; margin-bottom: 10px; }
    .prod-preco { color: var(--azul); font-weight: 700; margin-bottom: 15px; }
    .btn-sabores { 
        background: var(--azul); color: white; border: none; padding: 10px 15px; 
        border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%;
    }

    /* Modais */
    .modal { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 2000; 
    }
    .modal-content { 
        background: white; width: 100%; max-width: 600px; max-height: 90vh; 
        border-radius: 20px 20px 0 0; padding: 25px; overflow-y: auto; 
    }
    .sabor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .sabor-item { 
        padding: 12px; border: 2px solid #eee; border-radius: 10px; cursor: pointer; 
        text-align: center; font-weight: 600; background: #fff;
    }
    .sabor-item.sel { background: var(--verde); color: white; border-color: var(--verde); }
    .grid-sabores.limite-atingido .sabor-item:not(.sel) { opacity: 0.5; filter: grayscale(1); pointer-events: none; }
    
    /* Carrinho */
    .btn-carrinho-fixo {
        position: fixed; bottom: 20px; right: 20px; background: #FF6D00; color: white;
        padding: 15px 25px; border-radius: 50px; font-weight: 800; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        display: none; align-items: center; gap: 10px; z-index: 1500; border: none; cursor: pointer;
    }
    
    /* Estabilidade */
    .lock-scroll { overflow: hidden !important; }
  </style>
</head>
<body>

<header class="header">
  <h1>Itapolitana Cajuru - Encomendas (v5.0)</h1>
</header>

<div class="container">
  <!-- Categoria Caixas -->
  <div class="categoria">
    <button class="categoria-header" onclick="window.toggleSecao('sec-caixas')">
      <div><strong>🍦 Sorvete em Caixa</strong><br><small>5L e 10L - Ideal para festas</small></div>
      <span>▼</span>
    </button>
    <div id="sec-caixas" class="categoria-conteudo">
      <div id="lista-caixas" class="prod-grid"></div>
    </div>
  </div>

  <!-- Categoria Tortas -->
  <div class="categoria">
    <button class="categoria-header" onclick="window.toggleSecao('sec-tortas')">
      <div><strong>🎂 Tortas Geladas</strong><br><small>Especiais e decoradas</small></div>
      <span>▼</span>
    </button>
    <div id="sec-tortas" class="categoria-conteudo">
      <div id="lista-tortas" class="prod-grid"></div>
    </div>
  </div>

  <!-- Categoria Picolés -->
  <div class="categoria">
    <button class="categoria-header" onclick="window.toggleSecao('sec-picoles')">
      <div><strong>🍭 Picolés (Atacado)</strong><br><small>Mínimo 100 unidades</small></div>
      <span>▼</span>
    </button>
    <div id="sec-picoles" class="categoria-conteudo">
      <div id="lista-picoles" class="prod-grid"></div>
    </div>
  </div>
</div>

<!-- Modal de Sabores -->
<div id="modal-sabores" class="modal">
  <div class="modal-content">
    <h2 id="modal-titulo-sabores">Escolha os Sabores</h2>
    <p id="modal-subtitulo-sabores"></p>
    <div id="grid-sabores" class="sabor-grid"></div>
    <div style="margin-top: 20px; display: flex; gap: 10px;">
      <button onclick="window.fecharModal('modal-sabores')" style="flex: 1; padding: 15px; border-radius: 10px; border: 1px solid #ccc;">Voltar</button>
      <button id="btn-confirmar-sabores" onclick="window.confirmarSabores()" style="flex: 2; padding: 15px; border-radius: 10px; border: none; background: var(--verde); color: white; font-weight: 800;">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal de Picolés -->
<div id="modal-picoles" class="modal">
  <div class="modal-content">
    <h2>Picolés no Atacado</h2>
    <p>Mínimo de 100 unidades. Selecione por sabor:</p>
    <div id="lista-sabores-picole" style="max-height: 400px; overflow-y: auto;"></div>
    <div style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px; text-align: center;">
      <strong>Total: <span id="total-picoles">0</span> / 100</strong>
    </div>
    <div style="margin-top: 20px; display: flex; gap: 10px;">
      <button onclick="window.fecharModal('modal-picoles')" style="flex: 1; padding: 15px; border-radius: 10px; border: 1px solid #ccc;">Voltar</button>
      <button id="btn-confirmar-picoles" onclick="window.confirmarPickle()" disabled style="flex: 2; padding: 15px; border-radius: 10px; border: none; background: var(--verde); color: white; font-weight: 800;">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal de Carrinho -->
<div id="modal-carrinho" class="modal">
  <div class="modal-content">
    <h2>Seu Pedido</h2>
    <div id="lista-carrinho" style="margin-top: 15px;"></div>
    <div style="margin-top: 20px; padding: 15px; background: var(--azul); color: white; border-radius: 10px; display: flex; justify-content: space-between;">
      <strong>Total:</strong>
      <strong id="total-carrinho">R$ 0,00</strong>
    </div>
    <div style="margin-top: 20px; display: grid; gap: 10px;">
      <button onclick="window.fecharModal('modal-carrinho')" style="padding: 15px; border-radius: 10px; border: 1px solid #ccc;">Adicionar mais produtos</button>
      <button onclick="window.limparCarrinho()" style="padding: 10px; border: none; color: red; background: none;">🗑️ Excluir todo o pedido</button>
      <button onclick="window.finalizarPedido()" style="padding: 18px; border-radius: 12px; border: none; background: var(--verde); color: white; font-weight: 900; font-size: 1.1rem;">Finalizar no WhatsApp</button>
    </div>
  </div>
</div>

<!-- Botão Flutuante Carrinho -->
<button id="btn-carrinho-fixo" class="btn-carrinho-fixo" onclick="window.abrirCarrinho()">
  🛒 <span id="carrinho-qtd">0</span> itens - <span id="carrinho-total">R$ 0,00</span>
</button>

<script>
(function(window, document) {
    'use strict';
    
    var SABORES = ["Abacaxi ao Vinho", "Amarena", "Chocolate", "Ferrero Rocher", "Leite Ninho", "Morango Trufado", "Nutella", "Pistache", "Sensação", "Torta de Chocolate"];
    var PRODUTOS = [
        { id: "cx5l_2s", nome: "Caixa 5 Litros - 2 Sabores", preco: 100, max: 2, cat: 'caixas' },
        { id: "cx5l_3s", nome: "Caixa 5 Litros - 3 Sabores", preco: 115, max: 3, cat: 'caixas' },
        { id: "cx10l_2s", nome: "Caixa 10 Litros - 2 Sabores", preco: 150, max: 2, cat: 'caixas' },
        { id: "cx10l_3s", nome: "Caixa 10 Litros - 3 Sabores", preco: 165, max: 3, cat: 'caixas' }
    ];

    var carrinho = [];
    var produtoAtual = null;
    var saboresSelecionados = [];
    var picolesSelecionados = {};

    window.toggleSecao = function(id) {
        var el = document.getElementById(id);
        var isOpen = el.style.display === 'block';
        document.querySelectorAll('.categoria-conteudo').forEach(c => c.style.display = 'none');
        el.style.display = isOpen ? 'none' : 'block';
    };

    window.abrirModal = function(id) {
        document.getElementById(id).style.display = 'flex';
        document.body.classList.add('lock-scroll');
    };

    window.fecharModal = function(id) {
        document.getElementById(id).style.display = 'none';
        document.body.classList.remove('lock-scroll');
    };

    window.abrirSaboresSorvete = function(id, preco, max, nome) {
        produtoAtual = { id: id, preco: preco, max: max, nome: nome };
        saboresSelecionados = [];
        document.getElementById('modal-subtitulo-sabores').textContent = "Escolha " + max + " sabores";
        var grid = document.getElementById('grid-sabores');
        grid.innerHTML = SABORES.map(s => `<div class="sabor-item" onclick="window.toggleSabor('${s}', this)">${s}</div>`).join('');
        grid.classList.remove('limite-atingido');
        document.getElementById('btn-confirmar-sabores').disabled = true;
        window.abrirModal('modal-sabores');
    };

    window.toggleSabor = function(sabor, el) {
        var idx = saboresSelecionados.indexOf(sabor);
        if (idx > -1) {
            saboresSelecionados.splice(idx, 1);
            el.classList.remove('sel');
        } else {
            if (saboresSelecionados.length < produtoAtual.max) {
                saboresSelecionados.push(sabor);
                el.classList.add('sel');
            }
        }
        var grid = document.getElementById('grid-sabores');
        if (saboresSelecionados.length >= produtoAtual.max) grid.classList.add('limite-atingido');
        else grid.classList.remove('limite-atingido');
        document.getElementById('btn-confirmar-sabores').disabled = (saboresSelecionados.length !== produtoAtual.max);
    };

    window.confirmarSabores = function() {
        carrinho.push({
            nome: produtoAtual.nome,
            preco: produtoAtual.preco,
            detalhes: saboresSelecionados.join(', ')
        });
        window.fecharModal('modal-sabores');
        atualizarCarrinho();
    };

    window.abrirModalPicole = function() {
        picolesSelecionados = {};
        var lista = document.getElementById('lista-sabores-picole');
        lista.innerHTML = SABORES.map(s => `
            <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                <span>${s}</span>
                <div>
                    <button onclick="window.addPicole('${s}', -10)">-</button>
                    <span id="q-${s}" style="margin:0 10px;">0</span>
                    <button onclick="window.addPicole('${s}', 10)">+</button>
                </div>
            </div>
        `).join('');
        window.abrirModal('modal-picoles');
    };

    window.addPicole = function(sabor, qtd) {
        var atual = picolesSelecionados[sabor] || 0;
        picolesSelecionados[sabor] = Math.max(0, atual + qtd);
        document.getElementById('q-' + sabor).textContent = picolesSelecionados[sabor];
        var total = Object.values(picolesSelecionados).reduce((a, b) => a + b, 0);
        document.getElementById('total-picoles').textContent = total;
        document.getElementById('btn-confirmar-picoles').disabled = (total < 100);
    };

    window.confirmarPickle = function() {
        var total = Object.values(picolesSelecionados).reduce((a, b) => a + b, 0);
        var detalhes = Object.entries(picolesSelecionados).filter(e => e[1] > 0).map(e => e[1] + 'x ' + e[0]).join(', ');
        carrinho.push({
            nome: "Lote de Picolés (" + total + " un)",
            preco: total * 1.50,
            detalhes: detalhes
        });
        window.fecharModal('modal-picoles');
        atualizarCarrinho();
    };

    window.abrirCarrinho = function() {
        var lista = document.getElementById('lista-carrinho');
        var total = 0;
        lista.innerHTML = carrinho.map((item, i) => {
            total += item.preco;
            return `
                <div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
                    <div><strong>${item.nome}</strong><br><small>${item.detalhes}</small></div>
                    <div>R$ ${item.preco.toFixed(2)} <button onclick="window.removerItem(${i})">🗑️</button></div>
                </div>
            `;
        }).join('');
        document.getElementById('total-carrinho').textContent = "R$ " + total.toFixed(2);
        window.abrirModal('modal-carrinho');
    };

    window.removerItem = function(i) {
        carrinho.splice(i, 1);
        window.abrirCarrinho();
        atualizarCarrinho();
    };

    window.limparCarrinho = function() {
        if (confirm("Limpar pedido?")) {
            carrinho = [];
            atualizarCarrinho();
            window.fecharModal('modal-carrinho');
        }
    };

    function atualizarCarrinho() {
        var total = carrinho.reduce((a, b) => a + b.preco, 0);
        var btn = document.getElementById('btn-carrinho-fixo');
        if (carrinho.length > 0) {
            btn.style.display = 'flex';
            document.getElementById('carrinho-qtd').textContent = carrinho.length;
            document.getElementById('carrinho-total').textContent = "R$ " + total.toFixed(2);
        } else {
            btn.style.display = 'none';
        }
    }

    window.finalizarPedido = function() {
        var texto = "Olá! Gostaria de fazer uma encomenda:\n\n" + 
            carrinho.map(i => "* " + i.nome + " (" + i.detalhes + ") - R$ " + i.preco.toFixed(2)).join('\n') + 
            "\n\n*Total: R$ " + carrinho.reduce((a, b) => a + b.preco, 0).toFixed(2) + "*";
        window.open("https://wa.me/5516996062046?text=" + encodeURIComponent(texto));
    };

    // Render Inicial
    document.getElementById('lista-caixas').innerHTML = PRODUTOS.map(p => `
        <div class="prod-card">
            <div class="prod-nome">${p.nome}</div>
            <div class="prod-preco">R$ ${p.preco.toFixed(2)}</div>
            <button class="btn-sabores" onclick="window.abrirSaboresSorvete('${p.id}', ${p.preco}, ${p.max}, '${p.nome}')">Escolher Sabores</button>
        </div>
    `).join('');
    
    document.getElementById('lista-tortas').innerHTML = `
        <div class="prod-card">
            <div class="prod-nome">Torta Especial</div>
            <div class="prod-preco">R$ 100,00</div>
            <button class="btn-sabores" onclick="window.abrirSaboresSorvete('torta', 100, 3, 'Torta Especial')">Escolher Sabores</button>
        </div>
    `;

    document.getElementById('lista-picoles').innerHTML = `
        <div class="prod-card">
            <div class="prod-nome">Lote Picolés</div>
            <div class="prod-preco">R$ 1,50 / un</div>
            <button class="btn-sabores" onclick="window.abrirModalPicole()">Escolher Sabores</button>
        </div>
    `;

})(window, document);
</script>
</body>
</html>
