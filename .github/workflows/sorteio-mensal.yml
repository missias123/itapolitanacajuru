name: Renovar Sorteio Mensal

on:
  schedule:
    # Executa todo dia 01 de cada mês às 12:00 UTC (09:00 BRT)
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulação (não faz commit)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  renovar-sorteio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Renovar sorteio e reiniciar inscritos
        id: renovar
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import date, timedelta

          PATH = "dados/fidelidade.json"
          with open(PATH, encoding="utf-8") as f:
              fid = json.load(f)

          hoje = date.today()

          # Próximo dia 01: se hoje é dia 01, próximo mês; senão próximo mês também
          if hoje.month == 12:
              prox = date(hoje.year + 1, 1, 1)
          else:
              prox = date(hoje.year, hoje.month + 1, 1)

          sorteio = fid.get("sorteio", {})
          data_anterior = sorteio.get("dataProx", "")

          # Atualiza sorteio
          sorteio["dataProx"] = prox.strftime("%Y-%m-%d")
          sorteio["status"]   = "ativo"
          sorteio["vencedor"] = ""
          sorteio["obs"]      = f"Renovado automaticamente em {hoje.isoformat()}"
          sorteio["atualizado"] = hoje.strftime("%Y-%m-%dT12:00:00.000Z")
          fid["sorteio"] = sorteio

          # Zera lista de inscritos para o novo ciclo
          inscritos_anteriores = len(fid.get("sorteioInscritos", []))
          fid["sorteioInscritos"] = []

          with open(PATH, "w", encoding="utf-8") as f:
              json.dump(fid, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"✅ Sorteio renovado: {data_anterior} → {prox.isoformat()}")
          print(f"✅ Inscritos zerados: {inscritos_anteriores} participantes do ciclo anterior removidos")

          # Exporta para o step seguinte
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"data_anterior={data_anterior}\n")
              gh.write(f"data_nova={prox.isoformat()}\n")
              gh.write(f"inscritos_anteriores={inscritos_anteriores}\n")
          PYEOF

      - name: Commit e push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/fidelidade.json
          git diff --cached --quiet && echo "Sem alterações." && exit 0
          git commit -m "chore(sorteio): renovar ciclo mensal → ${{ steps.renovar.outputs.data_nova }} (anterior: ${{ steps.renovar.outputs.data_anterior }}, ${{ steps.renovar.outputs.inscritos_anteriores }} inscritos zerados)"
          git push

      - name: Resumo
        run: |
          echo "### 🎟️ Sorteio Mensal Renovado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Ciclo anterior encerrado | ${{ steps.renovar.outputs.data_anterior }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Novo prazo (próximo sorteio) | ${{ steps.renovar.outputs.data_nova }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Inscritos zerados | ${{ steps.renovar.outputs.inscritos_anteriores }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ativo ✅ |" >> $GITHUB_STEP_SUMMARY
