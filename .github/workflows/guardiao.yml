name: 🛡️ Guardião Itapolitana

# Executa em todo push para a branch principal
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validar-html:
    name: 🔍 Validar HTML (Sem Código Solto)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Verificar código solto no HTML
        run: |
          python3 << 'EOF'
          import re, sys, os

          # Arquivos HTML para verificar
          arquivos = [f for f in os.listdir('.') if f.endswith('.html')]
          erros = []

          # Padrões que NÃO podem aparecer como texto solto fora de tags HTML
          padroes_proibidos = [
              r'class="[^"]*"\s+id="[^"]*"',        # class="..." id="..." solto
              r'onkeydown="[^"]*"',                   # onkeydown="..." solto
              r'placeholder="[^"]*"',                 # placeholder="..." solto fora de tag
          ]

          for arquivo in arquivos:
              with open(arquivo, 'r', encoding='utf-8') as f:
                  conteudo = f.read()

              # Remover conteúdo dentro de tags HTML (< ... >)
              sem_tags = re.sub(r'<[^>]+>', '', conteudo)
              # Remover conteúdo dentro de scripts e styles
              sem_scripts = re.sub(r'<script[^>]*>.*?</script>', '', conteudo, flags=re.DOTALL)
              sem_styles = re.sub(r'<style[^>]*>.*?</style>', '', sem_scripts, flags=re.DOTALL)
              texto_visivel = re.sub(r'<[^>]+>', '', sem_styles)

              for padrao in padroes_proibidos:
                  matches = re.findall(padrao, texto_visivel)
                  if matches:
                      erros.append(f"❌ ERRO em {arquivo}: Código solto encontrado: {matches[0][:80]}")

          if erros:
              print("\n🚨 GUARDIÃO ITAPOLITANA — ERROS ENCONTRADOS:")
              for e in erros:
                  print(e)
              print("\n💡 Corrija o código solto antes de publicar!")
              sys.exit(1)
          else:
              print("✅ GUARDIÃO ITAPOLITANA — HTML limpo! Nenhum código solto encontrado.")
          EOF

      - name: 🔒 Verificar CNAME (domínio oficial)
        run: |
          if [ -f "CNAME" ]; then
            DOMINIO=$(cat CNAME | tr -d '[:space:]')
            if [ "$DOMINIO" = "itapolitanacajuru.com.br" ]; then
              echo "✅ CNAME correto: $DOMINIO"
            else
              echo "❌ ERRO: CNAME incorreto! Encontrado: $DOMINIO — Esperado: itapolitanacajuru.com.br"
              exit 1
            fi
          else
            echo "❌ ERRO: Arquivo CNAME não encontrado! O domínio oficial pode estar perdido."
            exit 1
          fi

      - name: 📋 Verificar PROTOCOLO.md
        run: |
          if [ -f "PROTOCOLO.md" ]; then
            echo "✅ PROTOCOLO.md presente no repositório."
          else
            echo "⚠️ AVISO: PROTOCOLO.md não encontrado! As regras do projeto podem ter sido perdidas."
          fi

      - name: ✅ Relatório Final
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "  🍦 GUARDIÃO ITAPOLITANA — TUDO OK! 🍦"
          echo "  Site: https://itapolitanacajuru.com.br"
          echo "  Branch: main → Publicando agora..."
          echo "═══════════════════════════════════════"
