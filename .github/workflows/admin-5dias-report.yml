name: 📈 Relatório Admin — Últimos 5 dias

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relatorio-5dias:
    name: Gerar relatório operacional de 5 dias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar relatório
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/gerar-relatorio-5dias.js

      - name: Commitar relatório se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/relatorios/admin-espelho-ultimos-5-dias.md
          if git diff --staged --quiet; then
            echo "Sem alterações no relatório."
          else
            git commit -m "docs: atualizar relatório admin últimos 5 dias [skip ci]"
            git push
          fi
