name: 🗂️ Consistência Site-Admin

on:
  push:
    paths:
      - 'dados/config.json'
      - 'dados/content_map.json'
  pull_request:
    paths:
      - 'dados/config.json'
      - 'dados/content_map.json'
  workflow_dispatch:

jobs:
  validar-consistencia:
    name: Verificar chaves obrigatórias do config.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validar chaves obrigatórias do config.json
        run: |
          node - <<'EOF'
          const fs   = require('fs');
          const map  = JSON.parse(fs.readFileSync('dados/content_map.json','utf8'));
          const cfg  = JSON.parse(fs.readFileSync('dados/config.json','utf8'));

          const required = map.chaves_obrigatorias || [];
          const missing  = required.filter(k => cfg[k] == null || cfg[k] === '');

          if (missing.length > 0) {
            console.error('❌ Chaves obrigatórias ausentes em config.json:', missing.join(', '));
            process.exit(1);
          }
          console.log('✅ Todas as', required.length, 'chaves obrigatórias estão presentes no config.json.');
          EOF

      - name: Verificar campos sem adminId (campos sem edição no admin)
        run: |
          node - <<'EOF'
          const fs   = require('fs');
          const map  = JSON.parse(fs.readFileSync('dados/content_map.json','utf8'));

          const semAdmin = map.campos.filter(c => !c.adminId);
          if (semAdmin.length > 0) {
            console.warn('⚠️ Campos sem campo editável no admin (' + semAdmin.length + '):');
            semAdmin.forEach(c => console.warn('  -', c.id, '—', c.descricao));
          } else {
            console.log('✅ Todos os campos possuem campo editável no admin.');
          }
          // Nunca falha — apenas informa
          EOF

      - name: Validar JSON sem erros de sintaxe
        run: |
          for f in dados/config.json dados/content_map.json dados/produtos.json \
                   dados/promo.json dados/promocoes.json dados/encomendas.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('✅ $f OK')" || exit 1
          done
