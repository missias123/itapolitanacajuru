name: 🐛 Issue on Failure

on:
  workflow_run:
    workflows:
      - "🔍 Quality Check"
      - "🔐 CodeQL Security Scan"
      - "🔦 Lighthouse Audit"
      - "🎭 E2E Tests"
    types: [completed]

jobs:
  create-issue:
    name: Criar issue quando workflow falha
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      issues: write

    steps:
      - name: Criar issue de falha
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = context.payload.workflow_run;
            const title = `❌ Falha no workflow: ${workflow.name}`;
            const body = [
              `## Workflow falhou`,
              ``,
              `- **Workflow:** ${workflow.name}`,
              `- **Branch:** ${workflow.head_branch}`,
              `- **Commit:** ${workflow.head_sha.substring(0, 7)}`,
              `- **Autor:** ${workflow.triggering_actor?.login || 'desconhecido'}`,
              `- **URL:** ${workflow.html_url}`,
              ``,
              `Por favor, verifique os logs e corrija o problema antes de fazer novo push para \`main\`.`,
            ].join('\n');

            // Verificar se já existe issue aberta para este workflow
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
            });

            const exists = issues.data.some(i => i.title === title);
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            }
