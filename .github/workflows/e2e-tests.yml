name: 🎭 E2E Tests — Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Testes diários às 02:00 UTC (23:00 Brasília, horário de menor tráfego)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package.json

      - name: Instalar dependências Playwright
        working-directory: tests
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: 🎭 Rodar testes E2E
        id: e2e_run
        working-directory: tests
        run: |
          npx playwright test --reporter=list,json,html 2>&1 | tee /tmp/e2e-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        continue-on-error: true
        env:
          CI: true

      - name: 📊 Gerar resumo de testes
        if: always()
        working-directory: tests
        run: |
          echo "## 🎭 Resultados dos Testes E2E Playwright" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "../docs/relatorios/playwright-results.json" ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('../docs/relatorios/playwright-results.json', 'utf8'));
              const stats = r.stats || {};
              const passed = stats.expected || 0;
              const failed = stats.unexpected || 0;
              const skipped = stats.skipped || 0;
              console.log('| Status | Qtd |');
              console.log('|--------|-----|');
              console.log(\`| ✅ Passou | \${passed} |\`);
              console.log(\`| ❌ Falhou | \${failed} |\`);
              console.log(\`| ⏭️ Ignorado | \${skipped} |\`);
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || cat /tmp/e2e-output.txt | tail -20 >> $GITHUB_STEP_SUMMARY
          else
            cat /tmp/e2e-output.txt | tail -30 >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📎 Upload de artefatos de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            docs/relatorios/playwright-html/
            docs/relatorios/playwright-results.json
            tests/test-results/
          retention-days: 7

      - name: ❌ Falhar se testes falharam
        if: steps.e2e_run.outputs.exit_code != '0'
        run: |
          echo "::error::Testes E2E Playwright falharam. Veja os artefatos para detalhes."
          exit 1
