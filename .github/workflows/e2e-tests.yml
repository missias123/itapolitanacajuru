name: 🎭 E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright — Testes de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependências dos testes
        run: npm ci
        working-directory: tests

      - name: Instalar browsers Playwright
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: Instalar serve
        run: npm install -g serve

      - name: Iniciar servidor local
        run: serve -s .. -l 8080 &
        working-directory: tests
        env:
          CI: true

      - name: Aguardar servidor
        run: npx wait-on http://localhost:8080 --timeout 30000
        working-directory: tests

      - name: Rodar testes E2E
        run: npx playwright test
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
          CI: true

      - name: Upload relatório Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
