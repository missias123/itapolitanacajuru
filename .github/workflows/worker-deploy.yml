name: ☁️ Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Wrangler Deploy — itapolitana-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar segredos obrigatórios
        run: |
          MISSING=""
          if [ -z "$CF_TOKEN" ]; then
            MISSING="$MISSING\n  • CLOUDFLARE_API_TOKEN — token da API do Cloudflare (permissao Workers:Edit)"
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            MISSING="$MISSING\n  • CLOUDFLARE_ACCOUNT_ID — ID da conta Cloudflare (dashboard.cloudflare.com)"
          fi
          if [ -n "$MISSING" ]; then
            echo "Segredos obrigatórios nao configurados no repositório GitHub:"
            printf "$MISSING\n"
            echo ""
            echo "Como configurar:"
            echo "  1. Acesse github.com/missias123/itapolitanacajuru/settings/secrets/actions"
            echo "  2. Clique em 'New repository secret'"
            echo "  3. Adicione CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Segredos necessários encontrados."
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Instalar dependências do Worker
        run: npm ci
        working-directory: cloudflare-worker

      - name: Rodar testes do Worker
        run: npm test
        working-directory: cloudflare-worker

      - name: Deploy para Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy --env production

      - name: Verificar health check da API após deploy
        run: |
          echo "Aguardando propagação do deploy (15s)..."
          sleep 15
          HTTP_STATUS=$(curl -s -o /tmp/health_response.json -w "%{http_code}" \
            -H "Accept: application/json" \
            "https://api.itapolitanacajuru.com.br/api/health" || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/health_response.json || true
          if [ "$HTTP_STATUS" != "200" ]; then
            echo ""
            echo "FALHA: A API não respondeu com HTTP 200 após o deploy."
            echo "Status recebido: $HTTP_STATUS"
            echo ""
            echo "Verifique:"
            echo "  1. Se o registro DNS api.itapolitanacajuru.com.br está configurado no Cloudflare (tipo AAAA 100::, proxied)."
            echo "  2. Se a rota api.itapolitanacajuru.com.br/* está ativa no dashboard Workers & Pages."
            echo "  3. Se os KV namespaces CLIENTES_KV, ENCOMENDAS_KV e RATE_KV existem com os IDs corretos."
            exit 1
          fi
          echo "API respondeu com HTTP 200. Deploy verificado com sucesso."
