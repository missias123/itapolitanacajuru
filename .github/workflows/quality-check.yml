name: 🔍 Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: ESLint + HTMLHint + Validações
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint JavaScript (ESLint)
        run: npx --yes eslint@8 scripts/*.js --max-warnings 20

      - name: Lint HTML (HTMLHint)
        run: |
          npx --yes htmlhint@1 \
            index.html encomendas.html promocao.html \
            carrossel.html dicas.html offline.html \
            --config .htmlhintrc

      - name: Verificar tokens expostos
        run: node scripts/check-exposed-tokens.js

      - name: Regra "tipo artesanal"
        run: node scripts/check-tipo-artesanal.js

      - name: Gate Admin ↔ Site (Matriz Espelho)
        run: node scripts/admin-espelho-gate.js

      - name: Validar JSONs
        run: |
          for f in dados/config.json dados/produtos.json dados/promo.json dados/fidelidade.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('✅ $f OK')"
          done
