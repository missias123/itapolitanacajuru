name: 🚀 CI — Validação e Auto-Repair

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: 🔍 Validar HTML e Segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar html-validate
        run: npm install -g html-validate@8

      - name: Verificar tokens expostos no código
        run: |
          echo "🔒 Verificando tokens e senhas hardcoded..."
          if grep -rn "ghp_\|github_pat_\|ghs_" --include="*.html" --include="*.js" . 2>/dev/null | grep -v ".git"; then
            echo "❌ BLOQUEADO: Token GitHub encontrado no código!"
            exit 1
          fi
          echo "✅ Nenhum token exposto encontrado."

      - name: Verificar JS em páginas HTML
        id: repair
        run: |
          node scripts/auto-repair.js --check
        continue-on-error: true

      - name: Auto-reparar se necessário (apenas no push para main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.repair.outcome == 'failure'
        run: |
          git config user.name  "auto-repair[bot]"
          git config user.email "auto-repair@itapolitanacajuru"
          node scripts/auto-repair.js
          if ! git diff --quiet; then
            git add -A
            git commit -m "fix(auto-repair): corrigir erros de JavaScript [skip ci]"
            git push
            echo "🔧 Correções aplicadas."
          fi

      - name: Verificar arquivos essenciais
        run: |
          echo "✅ Verificando arquivos críticos do site..."
          for f in index.html fidelidade.html encomendas.html dicas.html promocao.html carrossel.html manifest.json robots.txt sitemap.xml sw.js; do
            if [ ! -f "$f" ]; then
              echo "❌ Arquivo crítico ausente: $f"
              exit 1
            fi
            echo "  ✓ $f"
          done
          for f in dados/config.json dados/produtos.json; do
            if [ ! -f "$f" ]; then
              echo "❌ Dado crítico ausente: $f"
              exit 1
            fi
            echo "  ✓ $f"
          done
          echo "✅ Todos os arquivos críticos presentes."

      - name: Validar JSON de dados
        run: |
          echo "🗃️ Validando arquivos JSON..."
          for f in dados/config.json dados/produtos.json dados/promo.json manifest.json; do
            if [ -f "$f" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('  ✓ $f');" || { echo "❌ JSON inválido: $f"; exit 1; }
            fi
          done
          echo "✅ JSON válido."

      - name: Relatório de tamanho (aviso se página > 500KB)
        run: |
          echo "📦 Tamanho das páginas principais:"
          for f in index.html fidelidade.html encomendas.html; do
            size=$(wc -c < "$f")
            kb=$((size / 1024))
            if [ $kb -gt 500 ]; then
              echo "  ⚠️  $f: ${kb}KB (acima de 500KB — considere otimizar)"
            else
              echo "  ✓ $f: ${kb}KB"
            fi
          done
