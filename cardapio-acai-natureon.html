  <script>
    (function () {
      var button = document.getElementById('fechar-cardapio');
      button.addEventListener('click', function () {
        try {
          if (sessionStorage.getItem('itap_cardapio_acai_retorno')) {
            window.location.assign('index.html?retorno-cardapio-acai=1');
            return;
          }
        } catch (e) {}
