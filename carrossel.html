  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Acessibilidade: oculta visualmente mas mantém para leitores de tela */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    .itp-slider {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Gradiente sutil na base — profundidade visual premium */
    .itp-slider::after {
      content: '';
      position: absolute;
      inset: auto 0 0 0;
      height: 30%;
      background: linear-gradient(to top, rgba(0,0,0,0.28), transparent);
      pointer-events: none;
      z-index: 2;
    }

    .itp-slider .swiper-slide {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    /* Fotos preenchem 100 % do frame — sem barras pretas, sem corte */
    .itp-slider .swiper-slide img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
      /* Ken Burns: zoom suave enquanto o slide está ativo */
      transform-origin: center center;
      will-change: transform;
    }

    /* Ken Burns aplicado apenas no slide ativo */
    @keyframes itpKenBurns {
      0%   { transform: scale(1.00); }
      100% { transform: scale(1.07); }
    }
    .itp-slider .swiper-slide-active img {
      animation: itpKenBurns 8s ease-out forwards;
    }

    /* Transição suave ao trocar slide */
    .itp-slider .swiper-slide img {
      transition: opacity 0.4s ease;
    }

    /* Dots premium */
    .itp-slider .swiper-pagination {
      bottom: 16px;
      z-index: 3;
    }
    .itp-slider .swiper-pagination-bullet {
      position: relative;
      width: 24px; height: 24px;
      margin: 0 1px !important;
      background: transparent;
      opacity: 1;
      border-radius: 50%;
      touch-action: manipulation;
      transition: background 0.3s;
    }
    .itp-slider .swiper-pagination-bullet::before {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      width: 9px; height: 9px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
    }
    .itp-slider .swiper-pagination-bullet-active {
      background: transparent;
      transform: none;
      box-shadow: none;
    }
    .itp-slider .swiper-pagination-bullet-active::before {
      background: #fff;
      transform: translate(-50%, -50%) scale(1.55);
      box-shadow: 0 0 8px rgba(255,255,255,0.65);
    }

    /* WhatsApp fixo no topo direito, compacto para não atrapalhar o carrossel */
    .itp-whatsapp-badge {
      position: absolute;
      top: clamp(8px, 2vw, 20px);
      right: clamp(8px, 2vw, 20px);
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      max-width: min(calc(100vw - 20px), 250px);
      padding: 7px 12px 7px 9px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, rgba(8,38,34,.88), rgba(18,140,126,.82));
      box-shadow: 0 8px 24px rgba(0,0,0,.24), 0 0 0 1px rgba(37,211,102,.24), 0 0 20px rgba(37,211,102,.28);
      backdrop-filter: blur(10px) saturate(1.25);
      -webkit-backdrop-filter: blur(10px) saturate(1.25);
      text-decoration: none;
      line-height: 1.05;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      isolation: isolate;
    }
    .itp-whatsapp-badge::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.34);
    }
    .itp-whatsapp-badge:hover,
    .itp-whatsapp-badge:focus-visible {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.08);
      box-shadow: 0 10px 28px rgba(0,0,0,.28), 0 0 0 2px rgba(255,255,255,.55), 0 0 24px rgba(37,211,102,.42);
      outline: none;
    }
    .itp-whatsapp-badge:focus-visible { outline: 3px solid rgba(255,255,255,.92); outline-offset: 3px; }
    .itp-whatsapp-icon {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border-radius: 50%;
      background: #25D366;
      color: #fff;
      box-shadow: 0 0 12px rgba(37,211,102,.72);
    }
    .itp-whatsapp-icon svg { width: 18px; height: 18px; display: block; fill: currentColor; }
    .itp-whatsapp-copy { display: grid; gap: 3px; white-space: nowrap; }
    .itp-whatsapp-label { font: 800 10px/1 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .88; }
    .itp-whatsapp-number { font: 900 clamp(11px, 1.45vw, 14px)/1 Arial, sans-serif; letter-spacing: .02em; }
    @media (max-width: 600px) {
      .itp-whatsapp-badge {
        top: 8px;
        right: 8px;
        min-height: 38px;
        gap: 6px;
        max-width: calc(100vw - 16px);

      .itp-whatsapp-icon { width: 25px; height: 25px; flex-basis: 25px; }
      .itp-whatsapp-icon svg { width: 16px; height: 16px; }
      .itp-whatsapp-label { font-size: 8px; }
      .itp-whatsapp-number { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .itp-whatsapp-badge { transition: none; }
    }

      var DEFAULT_BANNERS = [

        { src: 'images/carrossel/v3_b5_eventos.webp', alt: 'Picolés para Eventos — Sorveteria Itapolitana Cajuru' },

      ];

      function bannerSrcSeguro(src) {
        var s = String(src || '').trim();
        if (!s) return '';
        if (/^https?:\/\//i.test(s)) return s;
        return s.replace(/^\/+/, '');
      }
      function bannerSourcesSeguro(banner) {
        var fontes = Array.isArray(banner && banner.srcSet) ? banner.srcSet : [banner && banner.src];
        var limpas = [];
        fontes.forEach(function (src) {
          var seguro = bannerSrcSeguro(src);
          if (seguro && limpas.indexOf(seguro) === -1) limpas.push(seguro);
        });
        return limpas;
      }

      function montarSlides(banners) {
        var wrap = document.getElementById('itp-carrossel-wrapper');
        if (!wrap) return;
        wrap.innerHTML = '';
        banners.forEach(function (b, i) {
          var fontes = bannerSourcesSeguro(b);
          if (!fontes.length) return;
          var slide = document.createElement('div');
          slide.className = 'swiper-slide';
          var img = document.createElement('img');
          var idxFonte = 0;
          function aplicarFonte() {
            img.src = fontes[idxFonte];
          }
          img.onerror = function () {
            idxFonte += 1;
            if (idxFonte < fontes.length) {
              aplicarFonte();
              return;
            }
            if (slide.parentNode) {
              slide.parentNode.removeChild(slide);
              if (swiper && typeof swiper.update === 'function') {
                if (swiper.params && swiper.params.loop && swiper.slides && swiper.slides.length <= 2 && typeof swiper.loopDestroy === 'function') {
                  swiper.loopDestroy();
                  swiper.params.loop = false;
                }
                swiper.update();
              }
            }
          };
          img.alt = String(b.alt || 'Banner Sorveteria Itapolitana Cajuru');
          img.setAttribute('loading', i === 0 ? 'eager' : 'lazy');
          img.setAttribute('decoding', 'async');
          aplicarFonte();
          slide.appendChild(img);
          wrap.appendChild(slide);
        });
      }

      function extrairBanners(cfg) {
        var banners = Array.isArray(cfg && cfg.banners) ? cfg.banners : [];
        banners = banners
          .filter(function (b) { return b && typeof b === 'object' && String(b.src || '').trim(); })
          .slice(0, 20);
        return banners.length ? banners : DEFAULT_BANNERS;
      }

      var swiper = null;
      var listenersRegistrados = false;
      var ajusteAlturaRegistrado = false;
      var ultimaAssinaturaAplicada = null;
      function assinaturaCarrossel(cfg) {
        var cc = cfg && cfg.carrosselConfig ? cfg.carrosselConfig : {};
        var seo = cfg && cfg.seoPaginas && cfg.seoPaginas.carrossel ? cfg.seoPaginas.carrossel : {};
        return JSON.stringify({
          banners: extrairBanners(cfg),
          titulo: seo.titulo || '',
          h1: cc.h1 || '',
          autoplayDelay: typeof cc.autoplayDelay === 'number' ? cc.autoplayDelay : 3000,
          transitionSpeed: typeof cc.transitionSpeed === 'number' ? cc.transitionSpeed : 800
        });
      }
      function iniciarCarrossel(cfg) {
        var assinaturaAtual = assinaturaCarrossel(cfg);
        if (assinaturaAtual === ultimaAssinaturaAplicada) return;
        var autoplayDelay = 3000;
        var transitionSpeed = 800;
        var titleEl = document.querySelector('title[data-config]');
        var h1El = document.querySelector('h1[data-config]');

        if (cfg) {
          if (cfg.seoPaginas && cfg.seoPaginas.carrossel && cfg.seoPaginas.carrossel.titulo && titleEl) {
            titleEl.textContent = cfg.seoPaginas.carrossel.titulo;
          }
          if (cfg.carrosselConfig) {
            if (cfg.carrosselConfig.h1 && h1El) h1El.textContent = cfg.carrosselConfig.h1;
            if (typeof cfg.carrosselConfig.autoplayDelay === 'number') autoplayDelay = cfg.carrosselConfig.autoplayDelay;
            if (typeof cfg.carrosselConfig.transitionSpeed === 'number') transitionSpeed = cfg.carrosselConfig.transitionSpeed;
          }
        }

        montarSlides(extrairBanners(cfg));

        if (swiper && typeof swiper.destroy === 'function') {
          swiper.destroy(true, true);
        }
        swiper = new Swiper('.itp-slider', {
          loop: true,
          observer: true,
          observeParents: true,
          observeSlideChildren: true,
          autoplay: {
            delay: autoplayDelay,
            disableOnInteraction: false,
            pauseOnMouseEnter: true
          },
          speed: transitionSpeed,
          effect: 'slide',
          grabCursor: true,
          keyboard: { enabled: true, onlyInViewport: true },
          touchRatio: 1,
          touchAngle: 45,
          pagination: { el: '.swiper-pagination', clickable: true },
          a11y: {
            prevSlideMessage: 'Banner anterior',
            nextSlideMessage: 'Próximo banner'
          }
        });

        function ensureAutoplay() {
          if (!swiper || !swiper.autoplay) return;
          if (document.hidden) return;
          if (!swiper.autoplay.running) swiper.autoplay.start();
        }
        if (!listenersRegistrados) {
          document.addEventListener('visibilitychange', ensureAutoplay);
          window.addEventListener('focus', ensureAutoplay, { passive: true });
          window.addEventListener('pageshow', ensureAutoplay, { passive: true });
          window.addEventListener('touchend', function () { setTimeout(ensureAutoplay, 120); }, { passive: true });
          listenersRegistrados = true;
        }

        /*
         * Ajuste automático da altura do iframe no site pai
         * Envia a altura real da imagem para o index.html redimensionar o iframe
         */
        function ajustarAltura() {
          var img = document.querySelector('.swiper-slide-active img');
          if (img && img.naturalHeight > 0) {
            var h = img.getBoundingClientRect().height;
            if (h > 0) {
              window.parent.postMessage({ itpCrsHeight: Math.ceil(h) }, '*');
            }
          }
        }

        if (!ajusteAlturaRegistrado) {
          window.addEventListener('load', function () {
            setTimeout(ajustarAltura, 200);
            window.addEventListener('resize', ajustarAltura);
          });
          ajusteAlturaRegistrado = true;
        }
        if (swiper) swiper.on('slideChangeTransitionEnd', ajustarAltura);
        ultimaAssinaturaAplicada = assinaturaAtual;
      }

      iniciarCarrossel(window.SITE_CONFIG || null);
      window.addEventListener('siteConfigLoaded', function (ev) {
        iniciarCarrossel(ev && ev.detail);
      });

    }());
