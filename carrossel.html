<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrossel – Sorveteria Itapolitana</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    crossorigin="anonymous"
  />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /*
     * TÉCNICA PROFISSIONAL — aspect-ratio nativo (CSS moderno)
     * Suportado por 97% dos navegadores (Chrome 88+, Safari 15+, Firefox 89+)
     * O carrossel se ajusta AUTOMATICAMENTE à proporção 3:2 das fotos
     * Sem corte, sem barra preta, perfeito em qualquer tela
     */
    .itp-slider {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .itp-slider .swiper-slide {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .itp-slider .swiper-slide img {
      width: 100%;
      height: auto;          /* altura automática — mantém proporção original */
      display: block;
      object-fit: contain;   /* foto inteira, sem corte */
    }

    /* Setas */
    .itp-slider .swiper-button-prev,
    .itp-slider .swiper-button-next {
      --swiper-navigation-size: 18px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      color: #fff;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.25s, transform 0.2s;
    }
    .itp-slider .swiper-button-prev:hover,
    .itp-slider .swiper-button-next:hover {
      background: rgba(0,0,0,0.72);
      transform: scale(1.1);
    }

    /* Dots */
    .itp-slider .swiper-pagination { bottom: 12px; }
    .itp-slider .swiper-pagination-bullet {
      width: 8px; height: 8px;
      background: rgba(255,255,255,0.55);
      opacity: 1;
      transition: transform 0.25s, background 0.25s;
    }
    .itp-slider .swiper-pagination-bullet-active {
      background: #fff;
      transform: scale(1.6);
    }
  </style>
</head>
<body>

  <div class="itp-slider swiper">
    <div class="swiper-wrapper">

      <div class="swiper-slide">
        <img src="images/carrossel/v3_b1_acai.webp"
             alt="Açaí do Seu Jeito — O Mais Pedido — Sorveteria Itapolitana Cajuru"
             loading="eager" decoding="async" width="1536" height="1024"/>

      <div class="swiper-slide">
        <img src="images/carrossel/v3_b7_escolha_favorito.webp"
             alt="Escolha o Seu Favorito — Taça Suja, Milkshake, Açaí e Sorvete — Sorveteria Itapolitana Cajuru"

      <div class="swiper-slide">

             alt="Brownie com Sorvete — Combinação Irresistível — Sorveteria Itapolitana Cajuru"

    <div class="swiper-button-prev" aria-label="Banner anterior"></div>
    <div class="swiper-button-next" aria-label="Próximo banner"></div>
    <div class="swiper-pagination" role="tablist" aria-label="Banners"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      'use strict';

      var swiper = new Swiper('.itp-slider', {
        loop: true,
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
          pauseOnMouseEnter: true
        },
        speed: 800,
        effect: 'slide',
        grabCursor: true,
        keyboard: { enabled: true, onlyInViewport: true },
        touchRatio: 1,
        touchAngle: 45,
        pagination: { el: '.swiper-pagination', clickable: true },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev'
        },
        a11y: {
          prevSlideMessage: 'Banner anterior',
          nextSlideMessage: 'Próximo banner'
        }
      });

      /*
       * Ajuste automático da altura do iframe no site pai
       * Envia a altura real da imagem para o index.html redimensionar o iframe
       */
      function ajustarAltura() {
        var img = document.querySelector('.swiper-slide-active img');
        if (img && img.naturalHeight > 0) {
          var h = img.getBoundingClientRect().height;
          if (h > 0) {
            window.parent.postMessage({ itpCrsHeight: Math.ceil(h) }, '*');
          }
        }
      }

      window.addEventListener('load', function () {
        setTimeout(ajustarAltura, 200);
        window.addEventListener('resize', ajustarAltura);
        swiper.on('slideChangeTransitionEnd', ajustarAltura);
      });

    }());
  </script>

</body>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#fff}
  .crs{position:relative;width:100%;height:100%;overflow:hidden}
  .crs-track{display:flex;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);will-change:transform}
  .crs-slide{min-width:100%;height:100%;flex-shrink:0}
  .crs-slide img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
  /* dots */
  .crs-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
  .crs-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);border:1.5px solid rgba(255,255,255,.8);cursor:pointer;transition:background .3s,transform .3s}
  .crs-dot.ativo{background:#E8650A;transform:scale(1.35);border-color:#E8650A}
  /* setas */
  .crs-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.82);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.18);transition:background .2s}
  .crs-btn:hover{background:#fff}
  .crs-btn svg{width:16px;height:16px;fill:none;stroke:#E8650A;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .crs-prev{left:8px}
  .crs-next{right:8px}
  @media(max-width:480px){.crs-btn{width:28px;height:28px}.crs-dot{width:7px;height:7px}}
</style>
</head>
<body>
<div class="crs" id="crs" role="region" aria-label="Galeria Itapolitana" aria-roledescription="carrossel">
  <div class="crs-track" id="crsTrack">
    <div class="crs-slide"><img src="images/carrossel/v3_b1_acai.webp"             alt="Açaí Itapolitana"           loading="eager" decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b2_unicornio.webp"        alt="Sorvete Unicórnio"          loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b3_nutella.webp"          alt="Sorvete Nutella"            loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b4_ovomaltine.webp"       alt="Sorvete Ovomaltine"         loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b5_eventos.webp"          alt="Carrinho para Eventos"      loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b6_maracuja_diet.webp"    alt="Sorvete Maracujá Diet"      loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b7_escolha_favorito.webp" alt="Escolha seu Favorito"       loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b8_sorvetes_montanha.webp"alt="Sorvetes Montanha"          loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b9_brownie_sorvete.webp"  alt="Brownie com Sorvete"        loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b10_petit_gateau.webp"    alt="Petit Gâteau com Sorvete"   loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b11_cascao_3bolas.webp"   alt="Cascão 3 Bolas"             loading="lazy"  decoding="async"></div>
    <div class="crs-slide"><img src="images/carrossel/v3_b12_vitrine_produtos.webp"alt="Vitrine de Produtos"        loading="lazy"  decoding="async"></div>
  </div>

  <button class="crs-btn crs-prev" id="crsPrev" aria-label="Foto anterior">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button class="crs-btn crs-next" id="crsNext" aria-label="Próxima foto">
    <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
  </button>

  <div class="crs-dots" id="crsDots" role="tablist" aria-label="Slides"></div>
</div>

<script>
(function(){
  var TOTAL = 12;
  var INTERVALO = 4500;
  var atual = 0;
  var timer = null;
  var tocando = true;

  var track = document.getElementById('crsTrack');
  var dotsEl = document.getElementById('crsDots');

  /* criar dots */
  for(var i=0;i<TOTAL;i++){
    var d = document.createElement('button');
    d.className = 'crs-dot' + (i===0?' ativo':'');
    d.setAttribute('role','tab');
    d.setAttribute('aria-label','Foto '+(i+1));
    d.dataset.i = i;
    d.addEventListener('click', function(){ ir(+this.dataset.i); reiniciar(); });
    dotsEl.appendChild(d);
  }

  function ir(n){
    atual = (n + TOTAL) % TOTAL;
    track.style.transform = 'translateX(-'+atual*100+'%)';
    document.querySelectorAll('.crs-dot').forEach(function(d,idx){ d.classList.toggle('ativo', idx===atual); });
  }

  function avancar(){ ir(atual+1); }

  function iniciarTimer(){ timer = setInterval(avancar, INTERVALO); }
  function pararTimer(){ clearInterval(timer); }
  function reiniciar(){ pararTimer(); iniciarTimer(); }

  document.getElementById('crsPrev').addEventListener('click',function(){ ir(atual-1); reiniciar(); });
  document.getElementById('crsNext').addEventListener('click',function(){ ir(atual+1); reiniciar(); });

  /* pausar ao passar o mouse */
  var crs = document.getElementById('crs');
  crs.addEventListener('mouseenter',function(){ pararTimer(); tocando=false; });
  crs.addEventListener('mouseleave',function(){ iniciarTimer(); tocando=true; });

  /* swipe touch */
  var xStart=null;
  crs.addEventListener('touchstart',function(e){ xStart=e.touches[0].clientX; pararTimer(); },{passive:true});
  crs.addEventListener('touchend',function(e){
    if(xStart===null)return;
    var dx=xStart-e.changedTouches[0].clientX;
    if(Math.abs(dx)>40){ ir(dx>0?atual+1:atual-1); }
    xStart=null; iniciarTimer();
  },{passive:true});

  iniciarTimer();
})();
</script>
</body>
</html>
