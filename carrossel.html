<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrossel – Sorveteria Itapolitana</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    crossorigin="anonymous"
  />

  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
    }

    .itp-slider { width: 100%; height: 100%; position: relative; }

    .itp-slider .swiper-slide { overflow: hidden; }

    .itp-slider .swiper-slide img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      display: block;
      transform: scale(1.04);
      transition: transform 6s ease;
    }
    .itp-slider .swiper-slide-active img { transform: scale(1); }

    /* Setas */
    .itp-slider .swiper-button-prev,
    .itp-slider .swiper-button-next {
      --swiper-navigation-size: 18px;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,0.45); color: #fff;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.25s, transform 0.2s;
    }
    .itp-slider .swiper-button-prev:hover,
    .itp-slider .swiper-button-next:hover {
      background: rgba(0,0,0,0.72); transform: scale(1.1);
    }

    /* Dots */
    .itp-slider .swiper-pagination { bottom: 12px; }
    .itp-slider .swiper-pagination-bullet {
      width: 8px; height: 8px;
      background: rgba(255,255,255,0.50); opacity: 1;
      transition: transform 0.25s, background 0.25s;
    }
    .itp-slider .swiper-pagination-bullet-active {
      background: #fff; transform: scale(1.6);
    }
  </style>
</head>
<body>

  <div class="itp-slider swiper">
    <div class="swiper-wrapper">

      <div class="swiper-slide">
        <img src="images/carrossel/b1_acai_do_seu_jeito.webp"
             alt="Açaí do Seu Jeito — O Mais Pedido — Sorveteria Itapolitana Cajuru"
             loading="eager" decoding="async" width="1200" height="460"/>
      </div>

      <div class="swiper-slide">
        <img src="images/carrossel/b2_taca_unicornio.webp"
             alt="Taça Unicórnio — Venha Experimentar — Sorveteria Itapolitana Cajuru"
             loading="lazy" decoding="async" width="1200" height="460"/>
      </div>

      <div class="swiper-slide">
        <img src="images/carrossel/b3_sobremesa_nutella.webp"
             alt="Sobremesa dos Sonhos com Nutella — Sorveteria Itapolitana Cajuru"
             loading="lazy" decoding="async" width="1200" height="460"/>
      </div>

      <div class="swiper-slide">
        <img src="images/carrossel/b4_picole_ovomaltine.webp"
             alt="Picolé Ovomaltine Novo — Croquente por fora cremoso por dentro — Sorveteria Itapolitana Cajuru"
             loading="lazy" decoding="async" width="1200" height="460"/>
      </div>

      <div class="swiper-slide">
        <img src="images/carrossel/b5_picoles_eventos.webp"
             alt="Picolés para Eventos — Surpreenda seus convidados — Sorveteria Itapolitana Cajuru"
             loading="lazy" decoding="async" width="1200" height="460"/>
      </div>

      <div class="swiper-slide">
        <img src="images/carrossel/b6_picoles_eventos2.webp"
             alt="Picolés para Eventos — Peça Agora — Sorveteria Itapolitana Cajuru"
             loading="lazy" decoding="async" width="1200" height="460"/>
      </div>

    </div>

    <div class="swiper-button-prev" aria-label="Banner anterior"></div>
    <div class="swiper-button-next" aria-label="Próximo banner"></div>
    <div class="swiper-pagination" role="tablist" aria-label="Banners"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      'use strict';
      new Swiper('.itp-slider', {
        loop: true,
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
          pauseOnMouseEnter: true
        },
        speed: 800,
        effect: 'slide',
        grabCursor: true,
        keyboard: { enabled: true, onlyInViewport: true },
        touchRatio: 1,
        touchAngle: 45,
        pagination: {
          el: '.swiper-pagination',
          clickable: true
        },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev'
        },
        a11y: {
          prevSlideMessage: 'Banner anterior',
          nextSlideMessage: 'Próximo banner'
        }
      });
    }());
  </script>

</body>
</html>
